<!DOCTYPE html>
<html lang="pt-br">
<head>

</head>
<body>

        <!-- Barra de Busca Estruturada -->
        <div class="search-container">

                <label>Categoria</label>
                <input type="text" placeholder="Pesquise">
            </div>

            <div class="divider"></div>

            <!-- Campo: Horário -->

                <label>Horário</label>
                <input type="text" placeholder="Pesquise">
            </div>

            <div class="divider"></div>

            <!-- Campo: Palavras-chave -->
            <div class="search-item">
                <label>Palavras-chave</label>
                <input type="text" placeholder="Pesquise">
            </div>

            <!-- Botão de Busca  (Trocar pela lantejoula)-->
            <button class="main-search-btn" title="Buscar">
            
            </button>
        </div>
    </div>
